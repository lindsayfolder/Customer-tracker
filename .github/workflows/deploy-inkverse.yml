name: Deploy Inkverse to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/ai-bible-app-comic-4kv99f
    paths:
      - "bible-app/**"
      - ".github/workflows/deploy-inkverse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bible-app/package-lock.json
      - name: Install dependencies
        working-directory: bible-app
        run: npm ci
      - name: Build (GitHub Pages subpath)
        working-directory: bible-app
        env:
          DEPLOY_BASE: /Customer-tracker/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: bible-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
