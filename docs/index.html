<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cycle Care</title>
<meta name="description" content="A private, offline period tracker for you and your family." />
<meta name="theme-color" content="#6d28d9" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cycle Care" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<header class="app-header">
  <div class="app-header-inner">
    <button id="backBtn" class="icon-btn back-btn hidden" aria-label="Back">←</button>
    <h1 id="headerTitle">Cycle Care</h1>
    <button id="addPersonBtn" class="icon-btn" aria-label="Add person">＋</button>
  </div>
  <div id="installBanner" class="install-banner hidden">
    <span>Install this on your phone for one-tap access — even offline.</span>
    <button id="installHowBtn" class="link-btn">How?</button>
    <button id="installDismissBtn" class="icon-btn small" aria-label="Dismiss">×</button>
  </div>
</header>

<main id="app" class="app-main"></main>

<div id="modalRoot"></div>

<script src="js/app.js"></script>
</body>
</html>
