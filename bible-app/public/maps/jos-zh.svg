<svg viewBox="0 0 720 480" width="100%" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#fbf6ea"/>

  <!-- Canaan -->
  <path d="M50,60 C140,30 260,35 340,60 C395,80 415,130 405,190 C398,240 410,290 400,340 C390,395 350,440 290,455 C220,470 130,460 80,420 C45,390 40,340 48,290 C55,240 40,190 45,140 C47,110 48,80 50,60 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="95" y="122" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="95" dy="0">迦南</tspan>
    <tspan x="95" dy="1.15em">迦南</tspan>
  </text>

  <!-- Ai marker -->
  <circle cx="330" cy="160" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="344" y="158" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="344" dy="0">艾城</tspan>
    <tspan x="344" dy="1.15em">艾城</tspan>
  </text>

  <!-- Jericho marker -->
  <circle cx="385" cy="215" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="378" y="213" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="end">
    <tspan x="378" dy="0">耶利哥</tspan>
    <tspan x="378" dy="1.15em">耶利哥</tspan>
  </text>

  <!-- Hebron marker (southern campaign) -->
  <circle cx="200" cy="358" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="214" y="356" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="214" dy="0">希伯崙</tspan>
    <tspan x="214" dy="1.15em">希伯仑</tspan>
  </text>

  <!-- Hazor marker (northern campaign) -->
  <circle cx="140" cy="88" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="154" y="80" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="154" dy="0">夏瑣</tspan>
    <tspan x="154" dy="1.15em">夏琐</tspan>
  </text>

  <!-- Jordan river -->
  <path d="M452,30 C446,120 457,220 452,300 C450,340 454,362 460,382" fill="none" stroke="#2c5f7c" stroke-width="5" stroke-linecap="round"/>
  <text x="466" y="195" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="15" fill="#2c5f7c" transform="rotate(85 466 195)">
    <tspan x="466" dy="0">約但河</tspan>
    <tspan x="466" dy="1.15em">约但河</tspan>
  </text>

  <!-- Dead Sea -->
  <path d="M445,385 C460,375 490,378 505,395 C520,415 515,440 495,452 C470,462 445,455 438,435 C433,415 438,398 445,385 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="448" y="408" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="15" fill="#2c5f7c">
    <tspan x="448" dy="0">鹽海</tspan>
    <tspan x="448" dy="1.15em">盐海</tspan>
  </text>

  <!-- Moab (east of Jordan, journey's origin) -->
  <path d="M490,260 C540,235 600,245 630,280 C655,312 650,360 625,395 C605,425 570,450 530,445 C500,440 485,410 480,375 C475,335 480,295 490,260 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="520" y="333" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="520" dy="0">摩押</tspan>
    <tspan x="520" dy="1.15em">摩押</tspan>
  </text>

  <!-- Jordan crossing marker -->
  <circle cx="452" cy="235" r="6" fill="#fbf6ea" stroke="#c97a12" stroke-width="3"/>
  <text x="405" y="260" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="15" fill="#a8620a" text-anchor="end">
    <tspan x="405" dy="0">過約但河處</tspan>
    <tspan x="405" dy="1.15em">过约但河处</tspan>
  </text>

  <!-- Route: crossing -> Jericho -> Ai -> south sweep (Hebron) -> north sweep (Hazor) -->
  <path d="M452,235 C420,225 400,220 385,215 C365,198 345,178 330,160 C280,210 220,290 200,355 C170,300 130,190 140,90"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M133,94 L147,94 L140,80 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- compass -->
  <g transform="translate(650,60)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="476" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
