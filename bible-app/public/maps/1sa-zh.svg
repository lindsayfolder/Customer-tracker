<svg viewBox="0 0 720 480" width="100%" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#fbf6ea"/>

  <!-- Mediterranean Sea -->
  <path d="M0,20 C40,10 70,40 60,90 C50,150 70,220 55,290 C45,350 65,410 40,460 L0,460 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="28" y="95" text-anchor="middle" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="15" fill="#2c5f7c">
    <tspan x="28" dy="0">大海</tspan>
    <tspan x="28" dy="1.15em">大海</tspan>
  </text>

  <!-- Philistia -->
  <path d="M90,255 C130,240 178,252 192,290 C202,322 196,362 174,392 C154,417 112,420 92,393 C76,368 76,315 90,255 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="130" y="272" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="16" fill="#1c1a17" transform="rotate(90 130 272)">
    <tspan x="130" dy="0">非利士</tspan>
    <tspan x="130" dy="1.15em">非利士</tspan>
  </text>

  <!-- Benjamin & Judah hill country -->
  <path d="M140,55 C210,40 320,45 380,68 C420,88 428,140 405,178 C412,200 417,302 400,342 C384,382 338,412 288,417 C238,422 188,402 163,362 C142,322 148,255 158,188 C128,162 118,105 140,55 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="195" y="85" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="195" dy="0">便雅憫</tspan>
    <tspan x="195" dy="1.15em">便雅悯</tspan>
  </text>
  <text x="210" y="378" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="210" dy="0">猶大</tspan>
    <tspan x="210" dy="1.15em">犹大</tspan>
  </text>

  <!-- Gibeah marker (Saul's base) -->
  <circle cx="300" cy="145" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="314" y="134" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="314" dy="0">基比亞</tspan>
    <tspan x="314" dy="1.15em">基比亚</tspan>
  </text>

  <!-- Bethlehem marker (David's hometown) -->
  <circle cx="255" cy="315" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="188" y="303" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="188" dy="0">伯利恆</tspan>
    <tspan x="188" dy="1.15em">伯利恒</tspan>
  </text>

  <!-- Dead Sea -->
  <path d="M410,270 C435,258 462,270 470,305 C478,340 458,368 428,365 C405,362 392,335 396,305 C398,290 402,278 410,270 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="428" y="238" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c">
    <tspan x="428" dy="0">鹽海</tspan>
    <tspan x="428" dy="1.15em">盐海</tspan>
  </text>

  <!-- En Gedi marker (wilderness refuge) -->
  <circle cx="415" cy="335" r="6" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="393" y="300" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="end">
    <tspan x="393" dy="0">隱基底</tspan>
    <tspan x="393" dy="1.15em">隐基底</tspan>
  </text>
  <text x="393" y="337" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#55503f" text-anchor="end">
    <tspan x="393" dy="0">曠野</tspan>
    <tspan x="393" dy="1.15em">旷野</tspan>
  </text>

  <!-- Route: Gibeah -> En Gedi (David's flight from Saul) -->
  <path d="M300,150 C340,190 360,240 380,270 C395,295 402,312 408,325"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M400,318 L412,332 L396,332 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- compass -->
  <g transform="translate(650,60)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="476" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
