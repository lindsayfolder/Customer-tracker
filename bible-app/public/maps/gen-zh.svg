<svg viewBox="0 0 720 480" width="100%" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#fbf6ea"/>

  <!-- Great Sea (Mediterranean), NW corner -->
  <path d="M0,30 C50,15 110,35 150,25 C175,20 195,35 200,60 L200,130 C155,112 110,125 65,115 C35,108 15,113 0,108 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="18" y="66" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="15" fill="#2c5f7c">
    <tspan x="18" dy="0">大海</tspan>
    <tspan x="18" dy="1.15em">大海</tspan>
  </text>

  <!-- Canaan -->
  <path d="M115,65 C170,50 235,58 270,95 C298,128 296,175 278,215 C265,252 250,292 218,312 C182,328 140,312 122,280 C104,242 100,192 103,142 C105,112 106,86 115,65 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="148" y="178" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="148" dy="0">迦南</tspan>
    <tspan x="148" dy="1.15em">迦南</tspan>
  </text>

  <!-- Bethel marker -->
  <circle cx="212" cy="128" r="6.5" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="226" y="123" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="226" dy="0">伯特利</tspan>
    <tspan x="226" dy="1.15em">伯特利</tspan>
  </text>

  <!-- Hebron marker -->
  <circle cx="192" cy="258" r="6.5" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="206" y="253" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="206" dy="0">希伯崙</tspan>
    <tspan x="206" dy="1.15em">希伯仑</tspan>
  </text>

  <!-- Aram (Haran region), north -->
  <path d="M368,55 C410,20 470,15 512,42 C548,64 556,105 528,132 C496,158 444,152 408,130 C378,113 358,86 368,55 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="378" y="34" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="378" dy="0">亞蘭</tspan>
    <tspan x="378" dy="1.15em">亚兰</tspan>
  </text>

  <!-- Haran marker -->
  <circle cx="460" cy="95" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="474" y="92" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="474" dy="0">哈蘭</tspan>
    <tspan x="474" dy="1.15em">哈兰</tspan>
  </text>

  <!-- Mesopotamia -->
  <path d="M520,148 C580,118 652,128 690,170 C716,208 710,270 700,320 C696,372 680,424 638,442 C598,458 556,440 538,408 C518,378 514,336 520,296 C526,246 514,190 520,148 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="548" y="192" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="21" fill="#1c1a17">
    <tspan x="548" dy="0">米所波大米</tspan>
    <tspan x="548" dy="1.15em">米所波大米</tspan>
  </text>

  <!-- Euphrates river -->
  <path d="M462,118 C486,178 526,228 566,268 C602,306 630,348 652,384" fill="none" stroke="#2c5f7c" stroke-width="5" stroke-linecap="round"/>
  <text x="525" y="248" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c" transform="rotate(50 525 248)">
    <tspan x="525" dy="0">伯拉河</tspan>
    <tspan x="525" dy="1.15em">伯拉河</tspan>
  </text>

  <!-- Ur marker -->
  <circle cx="655" cy="388" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="636" y="408" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="636" dy="0">吾珥</tspan>
    <tspan x="636" dy="1.15em">吾珥</tspan>
  </text>

  <!-- Egypt -->
  <path d="M30,318 C18,368 28,420 70,450 C112,476 162,466 182,430 C198,398 188,358 170,328 C150,302 100,298 60,304 C48,306 35,310 30,318 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="46" y="378" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="46" dy="0">埃及</tspan>
    <tspan x="46" dy="1.15em">埃及</tspan>
  </text>

  <!-- Nile river -->
  <path d="M112,318 C104,358 116,400 98,442" fill="none" stroke="#2c5f7c" stroke-width="5" stroke-linecap="round"/>
  <text x="122" y="368" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="15" fill="#2c5f7c" transform="rotate(80 122 368)">
    <tspan x="122" dy="0">尼羅河</tspan>
    <tspan x="122" dy="1.15em">尼罗河</tspan>
  </text>

  <!-- Route: Ur -> Haran -> Bethel -> Hebron -->
  <path d="M652,382 C570,320 495,225 462,115 C410,88 305,98 255,118 C222,132 214,128 212,132 C200,168 194,215 192,250"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M185,244 L199,244 L192,258 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- Route: Canaan -> Egypt (Joseph / famine) -->
  <path d="M192,262 C168,296 142,320 122,348" fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M110,340 L126,342 L114,354 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- compass -->
  <g transform="translate(650,60)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="476" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
