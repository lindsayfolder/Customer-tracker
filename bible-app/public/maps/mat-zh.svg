<svg viewBox="0 0 720 480" width="100%" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#fbf6ea"/>

  <!-- Mediterranean Sea -->
  <path d="M0,0 L130,0 C110,90 145,180 120,270 C100,350 130,420 110,480 L0,480 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="16" y="170" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="19" fill="#2c5f7c" transform="rotate(-90 16 170)">
    <tspan x="16" dy="0">地中海</tspan>
    <tspan x="16" dy="1.15em">地中海</tspan>
  </text>

  <!-- Galilee (north) -->
  <path d="M220,50 C280,30 360,35 410,70 C450,100 460,150 440,195 C415,230 360,245 300,235 C255,228 220,200 210,160 C200,120 205,80 220,50 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="255" y="98" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="255" dy="0">加利利</tspan>
    <tspan x="255" dy="1.15em">加利利</tspan>
  </text>

  <!-- Sea of Galilee -->
  <ellipse cx="392" cy="140" rx="30" ry="22" fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="345" y="180" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c">
    <tspan x="345" dy="0">加利利海</tspan>
    <tspan x="345" dy="1.15em">加利利海</tspan>
  </text>

  <!-- Judea (south) -->
  <path d="M230,300 C270,280 330,278 370,300 C400,318 410,355 400,395 C390,435 350,460 300,455 C260,450 225,425 215,385 C207,350 210,320 230,300 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="255" y="333" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="255" dy="0">猶太</tspan>
    <tspan x="255" dy="1.15em">犹太</tspan>
  </text>

  <!-- Egypt (southwest) -->
  <path d="M40,340 C30,390 55,440 110,460 C150,470 190,455 205,420 C215,395 205,365 180,345 C145,320 80,320 40,340 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="72" y="393" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="72" dy="0">埃及</tspan>
    <tspan x="72" dy="1.15em">埃及</tspan>
  </text>

  <!-- Capernaum marker -->
  <circle cx="400" cy="118" r="6" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="405" y="80" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="405" dy="0">迦百農</tspan>
    <tspan x="405" dy="1.15em">迦百农</tspan>
  </text>

  <!-- Nazareth marker -->
  <circle cx="250" cy="190" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="175" y="165" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="175" dy="0">拿撒勒</tspan>
    <tspan x="175" dy="1.15em">拿撒勒</tspan>
  </text>

  <!-- Jerusalem marker -->
  <circle cx="320" cy="385" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="338" y="355" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="338" dy="0">耶路撒冷</tspan>
    <tspan x="338" dy="1.15em">耶路撒冷</tspan>
  </text>

  <!-- Bethlehem marker -->
  <circle cx="305" cy="420" r="6" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="200" y="418" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="200" dy="0">伯利恆</tspan>
    <tspan x="200" dy="1.15em">伯利恒</tspan>
  </text>

  <!-- Egypt waypoint -->
  <circle cx="115" cy="395" r="6" fill="#fbf6ea" stroke="#c97a12" stroke-width="3"/>
  <text x="25" y="345" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="15" fill="#a8620a">
    <tspan x="25" dy="0">逃往埃及</tspan>
    <tspan x="25" dy="1.15em">逃往埃及</tspan>
  </text>

  <!-- Route: Bethlehem -> Egypt -> Nazareth -> Capernaum -> Jerusalem -->
  <path d="M305,420 C230,415 150,405 115,395 C160,340 210,260 235,215 C240,205 245,197 250,190 C300,165 355,140 400,118 C415,175 400,250 375,310 C355,355 335,375 322,383"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <!-- arrowhead -->
  <path d="M312,372 L324,384 L308,388 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="345" y="290" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="15" fill="#a8620a">
    <tspan x="345" dy="0">受難</tspan>
    <tspan x="345" dy="1.15em">受难</tspan>
  </text>

  <!-- compass -->
  <g transform="translate(650,60)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="476" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
