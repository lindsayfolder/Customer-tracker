<svg viewBox="0 0 720 480" width="100%" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#fbf6ea"/>

  <!-- Great Sea (Mediterranean) sliver, west edge -->
  <path d="M0,0 L60,0 C42,80 58,160 38,240 C22,320 46,400 22,480 L0,480 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="16" y="220" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="13" fill="#2c5f7c" transform="rotate(-90 16 220)">
    <tspan x="16" dy="0">大海</tspan>
    <tspan x="16" dy="1.15em">大海</tspan>
  </text>

  <!-- Galilee -->
  <path d="M100,45 C180,20 300,25 385,50 C428,64 448,100 438,140 C428,176 380,192 310,188 C232,184 150,178 105,152 C72,132 68,88 100,45 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="150" y="87" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="150" dy="0">加利利</tspan>
    <tspan x="150" dy="1.15em">加利利</tspan>
  </text>

  <!-- Sea of Galilee -->
  <path d="M358,105 C380,94 405,100 414,122 C420,144 404,161 382,158 C361,155 347,136 350,117 C351,112 354,108 358,105 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="326" y="180" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#2c5f7c">
    <tspan x="326" dy="0">加利利海</tspan>
    <tspan x="326" dy="1.15em">加利利海</tspan>
  </text>

  <!-- Cana -->
  <circle cx="210" cy="130" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="222" y="128" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="222" dy="0">迦拿</tspan>
    <tspan x="222" dy="1.15em">迦拿</tspan>
  </text>

  <!-- Jordan river -->
  <path d="M372,160 C380,215 358,265 375,315 C385,350 398,380 390,415" fill="none" stroke="#2c5f7c" stroke-width="5" stroke-linecap="round"/>
  <text x="335" y="250" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c" transform="rotate(75 335 250)">
    <tspan x="335" dy="0">約但河</tspan>
    <tspan x="335" dy="1.15em">约但河</tspan>
  </text>

  <!-- Samaria -->
  <path d="M150,210 C215,190 300,195 350,220 C378,240 380,273 355,295 C315,323 235,317 180,297 C150,280 140,243 150,210 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="170" y="210" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="170" dy="0">撒瑪利亞</tspan>
    <tspan x="170" dy="1.15em">撒玛利亚</tspan>
  </text>

  <!-- Sychar / Jacob's Well -->
  <circle cx="255" cy="250" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="275" y="234" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="275" dy="0">敘加</tspan>
    <tspan x="275" dy="1.15em">叙加</tspan>
  </text>
  <text x="275" y="270" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#55503f">
    <tspan x="275" dy="0">雅各井</tspan>
    <tspan x="275" dy="1.15em">雅各井</tspan>
  </text>

  <!-- Judea -->
  <path d="M150,345 C220,323 320,327 390,347 C420,363 428,395 410,423 C378,450 300,455 220,445 C168,437 145,393 150,345 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="168" y="378" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="168" dy="0">猶太</tspan>
    <tspan x="168" dy="1.15em">犹太</tspan>
  </text>

  <!-- Dead Sea -->
  <path d="M400,415 C420,408 438,416 440,433 C442,450 425,460 407,456 C393,452 388,435 393,423 C395,418 397,416 400,415 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="385" y="457" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#2c5f7c">
    <tspan x="385" dy="0">死海</tspan>
    <tspan x="385" dy="1.15em">死海</tspan>
  </text>

  <!-- Jerusalem -->
  <circle cx="300" cy="390" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="312" y="372" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="312" dy="0">耶路撒冷</tspan>
    <tspan x="312" dy="1.15em">耶路撒冷</tspan>
  </text>

  <!-- Bethany -->
  <circle cx="335" cy="408" r="6" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="345" y="406" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="17" fill="#1c1a17">
    <tspan x="345" dy="0">伯大尼</tspan>
    <tspan x="345" dy="1.15em">伯大尼</tspan>
  </text>

  <!-- Route 1: Galilee to Jerusalem via Samaria -->
  <path d="M210,138 C230,180 210,220 240,255 C260,280 250,320 275,350 C285,365 292,378 297,387"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M288,378 L299,391 L280,388 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- Route 2: Galilee to Jerusalem via the Jordan valley -->
  <path d="M350,150 C370,190 400,220 385,260 C372,295 390,330 365,360 C348,377 328,384 314,384"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M320,376 L310,386 L322,392 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- Route 3: return trip, Jerusalem back to Galilee -->
  <path d="M298,384 C278,338 298,290 268,250 C244,216 258,176 240,152"
        fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M232,162 L238,146 L250,160 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <text x="420" y="292" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="14" fill="#a8620a">
    <tspan x="420" dy="0">逾越節朝聖路線</tspan>
    <tspan x="420" dy="1.15em">逾越节朝圣路线</tspan>
  </text>

  <!-- compass -->
  <g transform="translate(650,60)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="476" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
