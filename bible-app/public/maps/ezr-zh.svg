<svg viewBox="0 0 720 480" width="100%" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#fbf6ea"/>

  <!-- Mediterranean Sea -->
  <path d="M0,60 C30,50 55,90 45,150 C35,210 55,270 40,330 C30,375 45,410 30,450 L0,450 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="4" y="192" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c" transform="rotate(90 4 192)">
    <tspan x="4" dy="0">大海</tspan>
    <tspan x="4" dy="1.15em">大海</tspan>
  </text>

  <!-- Judah -->
  <path d="M110,130 C170,113 262,120 302,148 C327,172 330,222 310,262 C294,297 250,322 204,316 C160,310 118,290 103,250 C88,208 94,160 110,130 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="140" y="192" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="140" dy="0">猶大</tspan>
    <tspan x="140" dy="1.15em">犹大</tspan>
  </text>

  <!-- Babylon -->
  <path d="M430,105 C505,88 605,95 655,128 C692,153 696,212 674,258 C652,300 590,324 528,318 C472,312 428,280 412,234 C397,188 404,140 430,105 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="480" y="165" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="480" dy="0">巴比倫</tspan>
    <tspan x="480" dy="1.15em">巴比伦</tspan>
  </text>

  <!-- Euphrates -->
  <path d="M505,120 C516,180 500,235 515,290 C522,305 528,315 535,325" fill="none" stroke="#2c5f7c" stroke-width="5" stroke-linecap="round"/>
  <text x="540" y="222" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c" transform="rotate(78 540 222)">
    <tspan x="540" dy="0">伯拉河</tspan>
    <tspan x="540" dy="1.15em">伯拉河</tspan>
  </text>

  <!-- Jerusalem: rebuilt Temple marker -->
  <rect x="222" y="222" width="18" height="13" fill="#c97a12" stroke="#1c1a17" stroke-width="2"/>
  <path d="M217,222 L231,206 L245,222 Z" fill="#a8620a" stroke="#1c1a17" stroke-width="2"/>
  <text x="176" y="248" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="19" fill="#1c1a17">
    <tspan x="176" dy="0">耶路撒冷</tspan>
    <tspan x="176" dy="1.15em">耶路撒冷</tspan>
  </text>
  <text x="176" y="291" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#55503f">
    <tspan x="176" dy="0">殿宇重建</tspan>
    <tspan x="176" dy="1.15em">殿宇重建</tspan>
  </text>

  <!-- Route: Babylon -> Jerusalem (the return, Ezra 1-2) -->
  <path d="M465,215 C400,213 330,216 262,220" fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M262,213 L246,220 L262,228 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>
  <text x="300" y="178" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="17" fill="#a8620a">
    <tspan x="300" dy="0">歸回</tspan>
    <tspan x="300" dy="1.15em">归回</tspan>
  </text>

  <!-- compass -->
  <g transform="translate(650,420)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="476" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
