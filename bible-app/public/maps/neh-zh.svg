<svg viewBox="0 0 720 480" width="100%" height="480" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="480" fill="#fbf6ea"/>

  <!-- Mediterranean Sea -->
  <path d="M0,60 C30,50 55,90 45,150 C35,210 55,270 40,330 C30,375 45,410 30,450 L0,450 Z"
        fill="#dce8ec" stroke="#2c5f7c" stroke-width="2.5"/>
  <text x="4" y="192" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="16" fill="#2c5f7c" transform="rotate(90 4 192)">
    <tspan x="4" dy="0">大海</tspan>
    <tspan x="4" dy="1.15em">大海</tspan>
  </text>

  <!-- Judah -->
  <path d="M110,150 C168,133 258,140 296,168 C320,192 322,238 304,274 C288,306 246,328 202,322 C160,317 120,298 106,260 C92,222 96,178 110,150 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="140" y="212" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="22" fill="#1c1a17">
    <tspan x="140" dy="0">猶大</tspan>
    <tspan x="140" dy="1.15em">犹大</tspan>
  </text>

  <!-- Persia -->
  <path d="M410,70 C500,45 620,55 675,105 C712,140 715,215 690,270 C665,325 590,365 510,358 C445,352 400,310 388,255 C376,195 385,120 410,70 Z"
        fill="#f1e9d8" stroke="#1c1a17" stroke-width="3"/>
  <text x="470" y="140" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="24" fill="#1c1a17">
    <tspan x="470" dy="0">波斯</tspan>
    <tspan x="470" dy="1.15em">波斯</tspan>
  </text>

  <!-- Susa marker -->
  <circle cx="605" cy="215" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="625" y="203" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="625" dy="0">書珊</tspan>
    <tspan x="625" dy="1.15em">书珊</tspan>
  </text>
  <text x="558" y="256" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#55503f">
    <tspan x="558" dy="0">波斯京城</tspan>
    <tspan x="558" dy="1.15em">波斯京城</tspan>
  </text>

  <!-- Jerusalem marker with rebuilt city wall -->
  <circle cx="222" cy="240" r="15" fill="none" stroke="#1c1a17" stroke-width="2"/>
  <circle cx="222" cy="240" r="7" fill="#c97a12" stroke="#1c1a17" stroke-width="2.5"/>
  <text x="155" y="274" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17">
    <tspan x="155" dy="0">耶路撒冷</tspan>
    <tspan x="155" dy="1.15em">耶路撒冷</tspan>
  </text>
  <text x="140" y="317" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-size="14" fill="#55503f">
    <tspan x="140" dy="0">城牆重建</tspan>
    <tspan x="140" dy="1.15em">城墙重建</tspan>
  </text>

  <!-- Route: Susa -> Jerusalem (Nehemiah's journey) -->
  <path d="M592,222 C480,222 360,225 250,232" fill="none" stroke="#c97a12" stroke-width="4" stroke-dasharray="2,10" stroke-linecap="round"/>
  <path d="M250,225 L234,232 L250,240 Z" fill="#c97a12" stroke="#1c1a17" stroke-width="1.5"/>

  <!-- compass -->
  <g transform="translate(70,430)">
    <circle r="26" fill="#fbf6ea" stroke="#1c1a17" stroke-width="2.5"/>
    <path d="M0,-18 L6,0 L0,18 L-6,0 Z" fill="#1c1a17"/>
    <text y="-30" font-family="PingFang TC, PingFang SC, Microsoft YaHei, Heiti SC, sans-serif" font-weight="700" font-size="18" fill="#1c1a17" text-anchor="middle">北</text>
  </g>

  <!-- border frame -->
  <rect x="2" y="2" width="716" height="476" fill="none" stroke="#1c1a17" stroke-width="2"/>
</svg>
